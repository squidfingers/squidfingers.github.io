<div class="main-logo{{ if .IsHome }} main-logo--home{{ end }} | in-view">
  {{ with resources.Get "images/logo.svg" }}
    {{ $svg := .Content }}
    {{ if not $.Page.IsHome }}
      {{ $svg = printf `<a href="/">%s</a>` $svg }}
    {{ end }}
    {{ $svg | safeHTML }}
  {{ end }}
  <div>
    <h1>Travis Beckham</h1>
    <h2>UX &amp; System Design</h2>
  </div>
</div>
