{{ define "main" }}
  <div class="container--xl">
    <ul class="tag-list tag-list--vertical">
      {{ range .Data.Terms.ByCount }}
        <li>
          <a href="{{ .Page.RelPermalink }}" class="tag">
            {{ .Page.Title  | humanize | title }} ({{ .Count }})
          </a>
        </li>
      {{ end }}
    </ul>
  </div>
{{ end }}
