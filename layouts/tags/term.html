{{ define "main" }}
  <div class="container--lg">
    <div class="update-list">
      <h2 class="update-list__heading">
        Tag: {{ .Title | humanize | title }}
      </h2>
      {{ range .Pages.ByDate.Reverse }}
        {{ .Render "_views/update" }}
      {{ end }}
    </div>
  </div>
{{ end }}
